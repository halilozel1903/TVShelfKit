<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="TVShelfKit: media shelves for Apple TV in SwiftUI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="1" stop-color="#1a0b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e5484d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e5484d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="heroFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.8"/>
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#431407"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#052e16"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#3b0764"/></linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#083344"/></linearGradient>
    <linearGradient id="p5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eab308"/><stop offset="1" stop-color="#422006"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="screen"><rect x="640" y="70" width="580" height="346" rx="10"/></clipPath>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="930" cy="250" r="280" fill="url(#glow)" filter="url(#blur)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="235" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-2">TVShelfKit</text>
    <text x="82" y="290" fill="#cbd5e1" font-size="28" font-weight="500">Netflix-style media shelves for Apple TV</text>
    <g font-size="20" font-weight="600">
      <rect x="82" y="330" width="124" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="144" y="357" fill="#e2e8f0" text-anchor="middle">SwiftUI</text>
      <rect x="218" y="330" width="124" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="280" y="357" fill="#e2e8f0" text-anchor="middle">tvOS 18+</text>
      <rect x="354" y="330" width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="414" y="357" fill="#e2e8f0" text-anchor="middle">Swift 6</text>
    </g>
  </g>

  <!-- TV -->
  <g filter="url(#shadow)">
    <rect x="628" y="58" width="604" height="370" rx="18" fill="#111318" stroke="#2a2f3a" stroke-width="2"/>
  </g>
  <rect x="880" y="428" width="100" height="12" rx="3" fill="#1f232b"/>
  <rect x="820" y="440" width="220" height="10" rx="5" fill="#1f232b"/>

  <g clip-path="url(#screen)">
    <rect x="640" y="70" width="580" height="346" fill="#0b0c10"/>
    <!-- Hero -->
    <rect x="640" y="70" width="580" height="190" fill="url(#hero)"/>
    <circle cx="1080" cy="130" r="90" fill="#93c5fd" fill-opacity="0.35" filter="url(#blur)"/>
    <path d="M1080 100 l10 26 l27 2 l-21 17 l7 26 l-23 -15 l-23 15 l7 -26 l-21 -17 l27 -2 Z" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="640" y="70" width="580" height="190" fill="url(#heroFade)"/>
    <text x="664" y="104" fill="#ff5a55" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="3">LUMEN</text>
    <text x="664" y="170" fill="#ffffff" font-family="-apple-system, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="30" font-weight="800">Northern Lights</text>
    <text x="664" y="192" fill="#e2e8f0" fill-opacity="0.8" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11">2026 · 1h 54m · TV-14 · Sci-Fi</text>
    <rect x="664" y="206" width="70" height="24" rx="12" fill="#ffffff"/>
    <text x="699" y="222" fill="#000" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">▶ Play</text>
    <rect x="742" y="206" width="84" height="24" rx="12" fill="#ffffff" fill-opacity="0.2"/>
    <text x="784" y="222" fill="#fff" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">More Info</text>
    <rect x="664" y="240" width="16" height="5" rx="2.5" fill="#fff"/>
    <rect x="684" y="240" width="5" height="5" rx="2.5" fill="#fff" fill-opacity="0.4"/>
    <rect x="693" y="240" width="5" height="5" rx="2.5" fill="#fff" fill-opacity="0.4"/>

    <!-- Row -->
    <text x="664" y="282" fill="#ffffff" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Trending Now</text>
    <rect x="664" y="292" width="76" height="108" rx="6" fill="url(#p1)"/>
    <rect x="752" y="292" width="76" height="108" rx="6" fill="url(#p2)"/>
    <rect x="928" y="292" width="76" height="108" rx="6" fill="url(#p4)"/>
    <rect x="1016" y="292" width="76" height="108" rx="6" fill="url(#p5)"/>
    <rect x="1104" y="292" width="76" height="108" rx="6" fill="url(#p1)"/>
    <!-- Focused poster: larger, lifted, outlined -->
    <g filter="url(#shadow)">
      <rect x="834" y="283" width="88" height="126" rx="7" fill="url(#p3)" stroke="#ffffff" stroke-width="2.5"/>
    </g>
    <circle cx="878" cy="330" r="18" fill="#ffffff" fill-opacity="0.35"/>
    <text x="842" y="396" fill="#ffffff" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="11" font-weight="900">EMBERFALL</text>
  </g>
</svg>
